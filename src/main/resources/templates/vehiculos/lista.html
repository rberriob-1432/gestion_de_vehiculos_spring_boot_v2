<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vehículos</title>
</head>
<body>
<h1>Lista de Vehículos</h1>
<a th:href="@{/vehiculos/nuevo}">Nuevo vehículo</a>
<br><br>
<form th:action="@{/vehiculos/buscar}" method="get">
    <label>Placa:</label>
    <input type="text" name="placa">
    <label>Categoría:</label>
    <input type="text" name="categoria">
    <label>Combustible:</label>
    <input type="text" name="combustible">
    <button type="submit">Buscar</button>
</form>
<br>
<table border="1">
    <thead>
    <tr>
        <th>Placa</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Versión</th>
        <th>Color</th>
        <th>Puestos</th>
        <th>Puertas</th>
        <th>Combustible</th>
        <th>Kilómetros</th>
        <th>Cilindraje</th>
        <th>Categoría</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vehiculo : ${vehiculos}">
        <td th:text="${vehiculo.placa}"></td>
        <td th:text="${vehiculo.marca}"></td>
        <td th:text="${vehiculo.modelo}"></td>
        <td th:text="${vehiculo.version}"></td>
        <td th:text="${vehiculo.color}"></td>
        <td th:text="${vehiculo.numPuestos}"></td>
        <td th:text="${vehiculo.numPuertas}"></td>
        <td th:text="${vehiculo.combustible}"></td>
        <td th:text="${vehiculo.kilometros}"></td>
        <td th:text="${vehiculo.cilindraje}"></td>
        <td th:text="${vehiculo.categoria}"></td>
        <td>
            <a th:href="@{/vehiculos/editar/{placa}(placa=${vehiculo.placa})}">
                Editar
            </a>
            |
            <a th:href="@{/vehiculos/eliminar/{placa}(placa=${vehiculo.placa})}">
                Eliminar
            </a>
        </td>
    </tr>
    </tbody>
</table>
<br>
<a th:href="@{/usuarios}">Usuarios</a>
</body>
</html>
