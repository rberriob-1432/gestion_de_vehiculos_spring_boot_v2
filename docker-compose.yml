services:

  postgres:
    image: postgres:18
    container_name: gestion-vehiculos-db
    environment:
      POSTGRES_DB: gestion_vehiculos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    container_name: gestion-vehiculos-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestion_vehiculos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456789
    restart: unless-stopped

volumes:
  postgres_data:
